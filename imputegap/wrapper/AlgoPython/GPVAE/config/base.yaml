# type: args
  

# so far only with physionet configurations 
# - maybe test to optimize them based on the given input
# - maybe also implement hmnist and sprites 
model:
  data_type: 'physionet'
  latent_dim: 35
  encoder_sizes: [128, 128]
  decoder_sizes: [256, 256]
  beta: 0.2
  sigma: 1.0
  cnn_kernel_size: 3
  cnn_size: [256]
  M: 1
  K: 1
  kernel: 'cauchy'
  kernel_scales: 1
  
train:
  learning_rate: 1e-3
  gradient_clip: 1e4
  num_steps: 0
  missing_ratio: 0.2